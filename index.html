<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTAL UJIAN SEKOLAH</title>

  <!-- ========================================================================= -->
  <!-- [LIBRARY EXTERNAL]                                                        -->
  <!-- ========================================================================= -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- ========================================================================= -->
  <!-- [STYLING TEMA: COURIER NEW BOLD & BLOKIR SELEKSI TEKS]                     -->
  <!-- ========================================================================= -->
  <style>
    * {
      font-family: 'Courier New', Courier, monospace !important;
      font-weight: 700 !important;
    }
    body {
      background-color: #F8FAFC;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="text-gray-800">

  <div id="app" class="min-h-screen flex flex-col justify-between">
    
    <!-- ======================================================================= -->
    <!-- [HEADER APLIKASI - JUDUL KAPITAL]                                       -->
    <!-- ======================================================================= -->
    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center border-b-4 border-yellow-400">
      <h1 class="text-xl font-bold flex items-center gap-2 tracking-wide">
        <span class="bg-yellow-400 text-blue-900 px-2 py-0.5 rounded text-xs font-black">EXAM</span>
        PORTAL UJIAN SEKOLAH
      </h1>
      <div id="userInfo" class="hidden text-sm text-right">
        <p id="dispNama" class="font-bold text-yellow-300"></p>
        <p id="dispNISN" class="text-xs text-blue-200"></p>
      </div>
    </header>

    <!-- ======================================================================= -->
    <!-- [HALAMAN LOGIN & INPUT FORM]                                            -->
    <!-- ======================================================================= -->
    <main class="flex-grow flex items-center justify-center p-2 sm:p-4">
      
      <div id="viewLogin" class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold text-blue-900">MASUK UJIAN</h2>
          <p class="text-xs text-gray-500 mt-1">Scan QR / Tempel Link Form & Masukkan NISN Anda</p>
        </div>

        <!-- Tombol Input Link / Scan QR -->
        <div class="space-y-3 mb-6">
          <button onclick="openScanner()" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-2.5 px-4 rounded-xl text-sm flex justify-center items-center gap-2">
            📷 Pindai QR Soal
          </button>
          
          <button onclick="toggleLinkInput()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-blue-900 font-bold py-2.5 px-4 rounded-xl text-sm flex justify-center items-center gap-2">
            🔗 Tempel Link Google Form
          </button>

          <label class="w-full bg-white border-2 border-blue-800 text-blue-900 hover:bg-blue-50 font-bold py-2 px-4 rounded-xl text-sm cursor-pointer flex justify-center items-center gap-2">
            📁 Upload Gambar QR
            <input type="file" accept="image/*" class="hidden" onchange="handleQRUpload(event)">
          </label>
        </div>

        <!-- Input Link Form (Hidden) -->
        <div id="boxLinkSoal" class="hidden mb-4">
          <input type="text" id="inputUrlSoal" placeholder="https://docs.google.com/forms/d/e/..." class="w-full p-3 border rounded-xl text-sm focus:ring-2 focus:ring-blue-800">
        </div>

        <!-- Container Kamera QR Scanner -->
        <div id="reader" class="hidden w-full rounded-lg overflow-hidden border mb-4"></div>

        <hr class="my-4 border-gray-200">

        <!-- Form Validation NISN -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-gray-600 mb-1">NISN SISWA</label>
            <input type="number" id="inputNISN" required placeholder="Masukkan NISN" class="w-full p-3 border rounded-xl font-bold focus:ring-2 focus:ring-yellow-400">
          </div>
          <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-500 text-blue-900 font-bold py-3 rounded-xl shadow transition">
            BUKA SOAL UJIAN
          </button>
        </form>
      </div>

      <!-- ======================================================================= -->
      <!-- [WADAH TERKUNCI TEMPAT MEMBUKA GOOGLE FORM]                            -->
      <!-- ======================================================================= -->
      <div id="viewExam" class="hidden w-full h-[88vh] flex flex-col bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        
        <div class="bg-red-100 border-b border-red-300 text-red-700 px-4 py-2 text-xs flex justify-between items-center">
          <span>⚠️ <b>SISTEM DIKUNCI:</b> DILARANG KELUAR TAB / WINDOW! PELANGGARAN: <b id="cheatCount">0</b>/3</span>
          <span class="bg-red-600 text-white px-2 py-0.5 rounded text-[10px]">STATUS: AKTIF</span>
        </div>

        <!-- Frame Tempat Menampilkan Google Form -->
        <iframe id="formIframe" class="w-full h-full border-none" src="" allow="autoplay"></iframe>
      </div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center p-3 text-xs text-gray-400 bg-white border-t">
      &copy; 2026 PORTAL UJIAN SEKOLAH
    </footer>
  </div>

  <!-- ========================================================================= -->
  <!-- [LOGIKA JAVASCRIPT & PENGUNCIAN TAB]                                      -->
  <!-- ========================================================================= -->
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyX49eWMMYAq5-Wb8syBPspweE8YgjpwccQS26GcNiwjhePmx4HxgKtU--XpB8mTDAI/exec";

    let currentUser = null;
    let pelanggaranCount = 0;
    let html5QrcodeScanner = null;
    let isExamActive = false;

    // -------------------------------------------------------------------------
    // [1. DETEKSI KELUAR TAB / LEWAT BATAS PELANGGARAN -> AUTO RESET]
    // -------------------------------------------------------------------------
    
    // Mencegah Siswa Me-refresh / Menutup Tab Web Ujian
    window.addEventListener('beforeunload', (e) => {
      if (isExamActive) {
        e.preventDefault();
        e.returnValue = 'Ujian sedang berlangsung! Anda tidak diperbolehkan keluar dari halaman ini.';
        return e.returnValue;
      }
    });

    // Deteksi Pindah Tab / Pindah Aplikasi (Blur Event)
    window.addEventListener('blur', () => {
      if (isExamActive) {
        pelanggaranCount++;
        document.getElementById('cheatCount').innerText = pelanggaranCount;
        
        // Simpan Log Pelanggaran ke Google Sheets
        fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "logCheat", user: currentUser, pelanggaran: pelanggaranCount })
        }).catch(e => console.log(e));

        // Jika Pelanggaran Lebih Dari 3x (Mencapai 4x atau lebih) -> OTOMATIS Mengulang ke Halaman Awal
        if (pelanggaranCount > 3) {
          alert("AKSES DIBATALKAN!\n\nAnda telah keluar dari layar pengerjaan lebih dari 3 kali. Sistem secara otomatis mengembalikan Anda ke halaman awal.");
          resetToLogin();
          return;
        }

        alert(`PERINGATAN KECURANGAN #${pelanggaranCount}!\n\nAnda terdeteksi keluar dari tab pengerjaan ujian!\nMaksimal toleransi: 3 kali.`);
      }
    });

    // Reset total ke tampilan login awal
    function resetToLogin() {
      isExamActive = false;
      currentUser = null;
      pelanggaranCount = 0;
      
      document.getElementById('formIframe').src = "";
      document.getElementById('cheatCount').innerText = "0";
      document.getElementById('userInfo').classList.add('hidden');
      document.getElementById('viewExam').classList.add('hidden');
      document.getElementById('viewLogin').classList.remove('hidden');
      document.getElementById('inputNISN').value = "";
    }

    // Pemblokiran Klik Kanan & Tombol Pintasan Navigasi Keyboard
    document.addEventListener('contextmenu', event => event.preventDefault());

    document.addEventListener('keydown', function (e) {
      if (!isExamActive) return;

      // Blokir F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+W, Ctrl+N, Ctrl+T, Alt+Tab
      if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
        (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 87 || e.keyCode === 78 || e.keyCode === 84)) ||
        (e.altKey && e.keyCode === 9)
      ) {
        e.preventDefault();
        alert("Pintasan keyboard ini dilarang selama pengerjaan ujian!");
      }
    });

    // Format URL Google Form ke mode Embedded
    function formatGoogleFormUrl(rawUrl) {
      let url = rawUrl.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      
      if (url.includes('docs.google.com/forms')) {
        if (url.includes('embedded=true')) return url;
        if (url.includes('viewform')) {
          return url + (url.includes('?') ? '&embedded=true' : '?embedded=true');
        }
        if (url.includes('/edit')) {
          return url.replace(/\/edit.*$/, '/viewform?embedded=true');
        }
        return url + '?embedded=true';
      }
      return url;
    }

    // -------------------------------------------------------------------------
    // [2. LOGIKA INPUT LINK & SCAN QR CODE]
    // -------------------------------------------------------------------------

    function toggleLinkInput() {
      document.getElementById('boxLinkSoal').classList.toggle('hidden');
    }

    async function openScanner() {
      const readerElem = document.getElementById('reader');
      readerElem.classList.remove('hidden');

      if (html5QrcodeScanner) {
        try { await html5QrcodeScanner.stop(); } catch(e) {}
      }

      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          document.getElementById('inputUrlSoal').value = decodedText;
          html5QrcodeScanner.stop().then(() => {
            readerElem.classList.add('hidden');
            alert("QR Code Berhasil Dipindai!");
          });
        },
        (errorMessage) => {}
      ).catch(err => alert("Kamera tidak dapat diakses atau diizinkan."));
    }

    function handleQRUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const html5QrCode = new Html5Qrcode("reader");
      html5QrCode.scanFile(file, true)
        .then(decodedText => {
          document.getElementById('inputUrlSoal').value = decodedText;
          alert("QR Code Berhasil Dibaca dari File!");
        })
        .catch(() => alert("Gagal membaca QR Code dari gambar ini. Pastikan gambar QR jelas."));
    }

    // -------------------------------------------------------------------------
    // [3. LOGIKA LOGIN NISN & MEMBUKA FORM]
    // -------------------------------------------------------------------------

    async function handleLogin(e) {
      e.preventDefault();
      const nisn = document.getElementById('inputNISN').value.trim();
      const rawUrl = document.getElementById('inputUrlSoal').value.trim();

      if (!rawUrl) return alert("Mohon Scan QR atau Tempelkan Link Google Form Soal terlebih dahulu!");

      const formattedUrl = formatGoogleFormUrl(rawUrl);

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({ action: "login", nisn: nisn })
        });
        const res = await response.json();

        if (res.success) {
          currentUser = res.user;
          isExamActive = true;

          document.getElementById('dispNama').innerText = currentUser.nama;
          document.getElementById('dispNISN').innerText = "NISN: " + currentUser.nisn;
          document.getElementById('userInfo').classList.remove('hidden');

          document.getElementById('formIframe').src = formattedUrl;
          document.getElementById('viewLogin').classList.add('hidden');
          document.getElementById('viewExam').classList.remove('hidden');
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert("Gagal terhubung ke server database. Periksa koneksi internet Anda.");
      }
    }
  </script>
</body>
</html>
